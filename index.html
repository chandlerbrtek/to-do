<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>To-Do</h1>

    <form id="new-todo-form" class="new-todo">
      <input id="new-todo-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-message" class="empty">Nothing to do yet.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
